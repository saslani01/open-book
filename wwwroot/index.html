<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/deep-chat@2.0.1/dist/deepChat.bundle.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body class="d-flex flex-column vh-100">
  <nav class="navbar bg-dark" data-bs-theme="dark">
      <span class="navbar-brand ms-2 mb-0 h1">OpenBook</span>
  </nav>
  <div class="container-fluid py-3 flex-grow-1 d-flex flex-column">
    <div id="tabs" class="d-flex flex-wrap gap-2 mb-3"></div>
    <div class="input-group mb-2">
      <input id="username" type="text" class="form-control shadow-none" placeholder="GitHub username (e.g. torvalds)"/>
      <button id="start" class="btn btn-primary">New chat</button>
    </div>
    <div id="status" class="text-muted small mb-3"></div>

    <div id="chat-container" class="d-flex flex-grow-1 overflow-hidden"></div>
  </div>
</body>
</html>
